name: Daily Stats Report

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Generate report
        run: go run .

      - uses: EndBug/add-and-commit@v9
        with:
          message: 'add daily new stats'
          add: '.'  
