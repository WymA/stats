name: Daily Stats Report

on:
  schedule:
    # Runs at 01:30 UTC daily (09:30 Hong Kong Time, UTC+8)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Generate report
        env:
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
        run: go run .

      - uses: EndBug/add-and-commit@v9
        with:
          message: 'add daily new stats'
          add: '.'  
